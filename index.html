<style>
:root{--ink:#e9eef1;--night:#061523;--green:#123f37;--red:#dc5d3a;--gold:#e6b75e}*{box-sizing:border-box}html,body{margin:0;background:var(--night);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}button{font:inherit}.screen{min-height:100svh;position:relative;overflow:hidden}.night{background:radial-gradient(ellipse at 50% -8%,#1c5a59 0%,#0b2931 40%,#061523 82%)}.court-scene{position:absolute;inset:0;overflow:hidden;pointer-events:none}.court-floor{position:absolute;left:-18%;right:-18%;bottom:-22%;height:58%;background:linear-gradient(165deg,#17443e,#09232c 65%,#061923);clip-path:polygon(0 38%,100% 38%,86% 100%,14% 100%)}.court-floor:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.5%,#e4dfb91f 50%,transparent 50.5%),linear-gradient(165deg,transparent 35%,#e4dfb91f 35.5%,transparent 36%),linear-gradient(15deg,transparent 35%,#e4dfb91f 35.5%,transparent 36%)}.net{position:absolute;left:-5%;right:-5%;bottom:38%;height:32%;border-top:4px solid #ded9bd99;background:repeating-linear-gradient(90deg,transparent 0 17px,#ded9bd22 18px 19px),repeating-linear-gradient(0deg,transparent 0 17px,#ded9bd22 18px 19px);mask-image:linear-gradient(to bottom,#000 0%,#0008 58%,transparent)}.net:before,.net:after{content:"";position:absolute;top:-50px;width:6px;height:270px;background:#d7d1b6b0;box-shadow:0 0 18px #e8dca855}.net:before{left:13%}.net:after{right:13%}.lamp{position:absolute;width:190px;height:190px;border-radius:50%;filter:blur(8px);background:radial-gradient(circle,#e8da9c55 0 7%,#d7cb8d18 29%,transparent 67%)}.lamp.one{right:-64px;top:8%}.lamp.two{left:-90px;top:23%;opacity:.55}.bleachers{position:absolute;left:0;right:0;bottom:48%;height:12%;opacity:.28;background:repeating-linear-gradient(0deg,#b3c2ad 0 2px,transparent 2px 19px);transform:perspective(300px) rotateX(48deg)}.scene-note{position:absolute;right:20px;top:28px;font-size:9px;letter-spacing:.16em;color:#d9dfd0a8}.girl{z-index:2;right:clamp(32px,12vw,190px);bottom:clamp(92px,12vh,145px);width:clamp(142px,23vw,260px)}.stars{background-image:radial-gradient(circle at 8% 15%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 75% 12%,#b8e2df 0 1px,transparent 1.5px),radial-gradient(circle at 88% 44%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 21% 67%,#cbe7d7 0 1px,transparent 1.5px);background-size:210px 210px,260px 260px,310px 310px,360px 360px}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7;animation:twinkle 2.8s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.15;transform:scale(.5)}}
#intro{display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(28px,7vw,76px)}.intro-copy{z-index:2;max-width:640px;padding-bottom:max(16px,env(safe-area-inset-bottom))}.label{font-size:10px;letter-spacing:.22em;color:#9fadb4;margin-bottom:16px}h1{font-size:clamp(32px,6.2vw,76px);line-height:1.02;margin:0;letter-spacing:-.07em;font-weight:800}h1 span{color:var(--red)}.quote{margin:20px 0 22px;max-width:420px;font-size:11px;line-height:1.8;color:#9baba8;letter-spacing:.03em}.start{display:inline-flex;align-items:center;gap:10px;border:1px solid #ffffff24;border-radius:999px;padding:13px 18px;color:#fff;background:#ffffff12;box-shadow:0 10px 30px #0003;cursor:pointer;transition:.2s}.start:hover{transform:translateY(-2px);background:#ffffff20}.start-mark{width:17px;height:17px;border:1.4px solid #d8e4de;border-radius:50%;position:relative;display:inline-block}.start-mark:before,.start-mark:after{content:"";position:absolute;background:#d8e4de;left:3px;right:3px;height:1px;top:7px;transform:rotate(28deg)}.start-mark:after{transform:rotate(-36deg)}.girl{position:absolute;z-index:1;right:clamp(28px,13vw,220px);bottom:clamp(88px,12vh,150px);width:clamp(125px,20vw,240px);height:auto;border-radius:50%;box-shadow:0 24px 28px #0008;animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}@keyframes spin{to{rotate:360deg}}.map-girl img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid #f5ead9aa;box-shadow:0 9px 18px #0008}
#map{display:none;min-height:100svh;padding:24px 16px 40px;background:linear-gradient(180deg,#07192a,#08251f 65%,#0d3429)}#map.show{display:block}#intro.hide{display:none}.map-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;position:relative;z-index:2}.map-head h2{margin:4px 0;font-size:24px;letter-spacing:-.05em}.map-head p{margin:0;color:#9fb2ac;font-size:12px}.back{border:0;background:transparent;color:#c7d6d3;padding:10px;cursor:pointer}.route{position:relative;margin:26px auto 0;max-width:1100px;min-height:820px;background:radial-gradient(ellipse at 15% 72%,#b9ddbc22,transparent 25%),radial-gradient(ellipse at 75% 20%,#ffdea122,transparent 29%);border:1px solid #ffffff17;border-radius:28px;overflow:hidden}.route:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 22%,#f4eee312 22.3%,transparent 22.7%,transparent 50%,#f4eee312 50.3%,transparent 50.7%)}.route-title{position:absolute;top:30px;left:30px;font-size:12px;color:#b5c4be;letter-spacing:.13em}.path{position:absolute;left:10%;top:12%;width:78%;height:73%;border:2px dashed #ebebc255;border-radius:47% 44% 40% 55%;rotate:-10deg}.place{position:absolute;z-index:3;width:min(175px,38vw);background:transparent;border:0;color:#fff;text-align:left;cursor:pointer;padding:0}.place .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ebf3e522;border:1px solid #ffffff66;box-shadow:0 0 22px #dae9ca4d;margin-bottom:8px}.place b{font-size:15px;display:block}.place small{color:#b4c5bd;font-size:11px;line-height:1.5}@keyframes hop{50%{translate:5px -8px}}.map-girl{position:absolute;z-index:4;width:74px;height:74px;left:50%;top:52%;transition:left .7s cubic-bezier(.2,.8,.2,1),top .7s cubic-bezier(.2,.8,.2,1);animation:hop 2.2s ease-in-out infinite;filter:drop-shadow(0 9px 6px #0008)}.map-girl .head{width:30px;height:30px;background:#bd825e;border-radius:50%;position:absolute;left:24px;top:4px;z-index:2}.map-girl .pony{position:absolute;width:18px;height:31px;background:#17221e;border-radius:55% 45% 60% 40%;left:46px;top:0;rotate:25deg}.map-girl .shirt{position:absolute;width:38px;height:43px;left:20px;top:31px;background:#10191b;border-radius:15px 15px 7px 7px}.map-girl .shirt:after{content:"";position:absolute;width:14px;height:14px;left:12px;top:10px;border-radius:50%;background:#d6b94c}.map-girl .arm{position:absolute;width:32px;height:10px;left:48px;top:41px;border-radius:10px;background:#bd825e;rotate:-23deg}.map-girl .shorts{position:absolute;width:36px;height:16px;left:21px;top:71px;background:#15191c}.map-girl .leg{position:absolute;width:10px;height:25px;top:86px;background:#bd825e;border-radius:0 0 8px 8px}.map-girl .l1{left:26px}.map-girl .l2{left:45px}.map-girl .mini-ball{position:absolute;width:18px;aspect-ratio:1;border-radius:50%;right:0;top:38px;background:conic-gradient(#fff 0 17%,#df5739 17% 34%,#fff 34% 50%,#2d8f76 50% 67%,#fff 67% 83%,#df5739 83%);animation:spin 2s linear infinite}.p1{left:8%;top:62%}.p2{left:28%;top:43%}.p3{left:59%;top:13%}.p4{right:7%;top:38%}.p5{right:12%;bottom:11%}.p6{left:43%;bottom:9%}.p7{left:7%;top:23%}.p8{right:5%;top:67%}
dialog{border:0;background:transparent;padding:0;max-width:min(920px,94vw);width:100%;color:#fff}dialog::backdrop{background:#00080ed1;backdrop-filter:blur(8px)}.memory{position:relative;overflow:hidden;border-radius:24px;background:#0c1e25;box-shadow:0 30px 80px #000c;display:grid;grid-template-columns:1.05fr .95fr;min-height:440px}.memory img{width:100%;height:100%;min-height:440px;object-fit:cover;filter:saturate(.86) contrast(1.05)}.memory .text{padding:42px 38px;align-self:center}.year{color:var(--gold);font-size:11px;letter-spacing:.16em}.memory h3{font-size:32px;margin:12px 0 18px;letter-spacing:-.06em}.memory p{line-height:1.9;color:#d2dcd7;font-size:15px}.close{position:absolute;right:14px;top:14px;width:36px;height:36px;border:1px solid #ffffff33;border-radius:50%;background:#06121acc;color:#fff;font-size:20px;cursor:pointer;z-index:3}.next{border:0;background:var(--red);color:#fff;border-radius:9px;padding:10px 14px;margin-top:13px;cursor:pointer}
@media(max-width:620px){#intro{padding:28px 18px}.girl{right:42px;top:auto;bottom:140px;width:138px}.scene-note{top:22px;right:18px}.quote{font-size:9px;margin:16px 0 18px;max-width:270px}.start{padding:12px 14px;font-size:13px}.route{min-height:850px;border-radius:20px}.route-title{top:22px;left:20px}.place{width:108px}.place b{font-size:12px}.place small{font-size:9px}.p1{left:7%;top:67%}.p2{left:25%;top:46%}.p3{left:54%;top:16%}.p4{right:4%;top:42%}.p5{right:4%;bottom:12%}.p6{left:35%;bottom:7%}.p7{left:5%;top:25%}.p8{right:4%;top:70%}.map-girl{scale:.78}.memory{grid-template-columns:1fr;max-height:90svh;overflow:auto}.memory img{min-height:230px;height:230px}.memory .text{padding:26px 24px}.memory h3{font-size:27px}.memory p{font-size:14px}}
.place.locked{cursor:not-allowed;opacity:.52}.place.locked .dot{border-color:#f0cf7999;background:#e6b75e18}.gallery{position:relative;min-height:440px;background:#07151b;overflow:hidden}.gallery img{width:100%;height:100%;min-height:440px;object-fit:cover;filter:saturate(.86) contrast(1.05);transition:opacity .22s ease}.gallery-control{position:absolute;z-index:2;top:50%;translate:0 -50%;width:36px;height:36px;border:1px solid #ffffff55;border-radius:50%;background:#06121abb;color:#fff;font-size:24px;cursor:pointer}.gallery-prev{left:14px}.gallery-next{right:14px}.gallery-count{position:absolute;z-index:2;bottom:16px;right:18px;padding:6px 9px;border-radius:999px;background:#06121aaa;color:#fff;font-size:11px;letter-spacing:.08em}@media(max-width:620px){.gallery,.gallery img{min-height:230px;height:230px}.gallery-control{width:32px;height:32px}}</style></head>
<body><main>
<section id="intro" class="screen night stars"><div class="court-scene"><div class="lamp one"></div><div class="lamp two"></div><div class="bleachers"></div><div class="net"></div><div class="court-floor"></div><div class="scene-note">21:00 / 灯熄之后</div></div><i class="spark" style="left:14%;top:28%"></i><i class="spark" style="left:75%;top:58%"></i><img class="girl" src="assets/yijia-avatar.jpeg" alt="Yijia 的小人头像"><div class="intro-copy"><div class="label">YIJIA / VOL. 01</div><h1>昨天的失败者们，<br>今天的我们<br><span>又是什么人呢？</span></h1><p class="quote">今日は敗者であっても、それが君を決定づけるものではない。<br>明日の君はもう敗者じゃない。では、なにをする？何者になる？</p><button class="start" id="enter"><i class="start-mark"></i>点击探索排球故事</button></div></section>
<section id="map" class="stars"><header class="map-head"><div><div class="label">MY VOLLEYBALL ATLAS</div><h2>跟着球，回到那些时刻</h2><p>点亮八个光点，把四年慢慢走完。</p></div><button class="back" id="back">← 首页</button></header><div class="route"><div class="route-title">06:40 → 21:00 / 一天与四年的球场</div><div class="path"></div><div class="map-girl" id="mapGirl"><img src="assets/yijia-avatar.jpeg" alt="Yijia 的小人头像"></div>
<button class="place p1" data-memory="high" data-x="12%" data-y="61%"><span class="dot">0</span><b>高中</b><small>从这里开始</small></button><button class="place p2" data-memory="u20" data-x="31%" data-y="44%"><span class="dot">1</span><b>U20</b><small>第一次参赛</small></button><button class="place p3" data-memory="morning" data-x="57%" data-y="18%"><span class="dot">2</span><b>早训</b><small>06:40 的礼堂后</small></button><button class="place p4" data-memory="cup" data-x="72%" data-y="40%"><span class="dot">3</span><b>冠军杯</b><small>每年九月</small></button><button class="place p5" data-memory="league" data-x="80%" data-y="70%"><span class="dot">4</span><b>大联赛</b><small>那些比赛</small></button><button class="place p6" data-memory="farewell" data-x="48%" data-y="76%"><span class="dot">5</span><b>送大四</b><small>又一年毕业季</small></button><button class="place p7" data-memory="graduate" data-x="12%" data-y="26%"><span class="dot">6</span><b>送自己毕业</b><small>终于轮到我们</small></button><button class="place p8 locked" data-memory="message" data-x="79%" data-y="68%" aria-disabled="true"><span class="dot">🔒</span><b>彩蛋</b><small>走完前七站后开启</small></button></div></section></main>
<dialog id="memoryDialog"><article class="memory"><button class="close" id="close">×</button><div class="gallery"><img id="memoryImg" src="" alt="回忆照片"><button class="gallery-control gallery-prev" id="galleryPrev" aria-label="上一张照片">‹</button><button class="gallery-control gallery-next" id="galleryNext" aria-label="下一张照片">›</button><span class="gallery-count" id="galleryCount"></span></div><div class="text"><div class="year" id="memoryYear"></div><h3 id="memoryTitle"></h3><p id="memoryText"></p><button class="next" id="next">继续往前走 →</button></div></article></dialog>
<script>
const data={high:{imgs:['assets/high-school-court.jpg'],year:'0 / 高中',title:'几个人都不会打，却总往球场跑',text:'我第一次打排球，大概是在高二还是高三。好朋友拉着我去，几个人里没有一个人真的会打。但每次自由活动，我们还是会跑到排球场，乱打一通。后来才知道，那颗乱飞的球，会把我带到很远的地方。'},u20:{imgs:['assets/u20-2022.jpg'],year:'1 / 大学 U20',title:'还在学着把球发过去',text:'U20 是只属于大一、大二的比赛。那时还会为了一个发球反复练习，也还在队伍里慢慢找到自己的位置。'},morning:{imgs:['assets/morning-training.jpg'],year:'2 / 早训',title:'从节奏反着，到 100+',text:'一开始早训垫墙，我完全不会，甚至节奏都是反着的。疫情回家时我带了一颗球，每天对着家里的墙垫，垫着垫着，发现自己也能连续一百多个了。'},cup:{imgs:['assets/champions-cup.jpg','assets/cup-group-2023.jpg'],year:'3 / 冠军杯们',title:'第一次正式站在商排的场边',text:'从 2022 到 2023，冠军杯总在新学期的夜色里抵达。第一次上场、小组赛后的合照、决赛夜的球网和应援牌，都被好好留在这里。'},league:{imgs:['assets/league-cheer.jpg','assets/league-tactics.jpg','assets/league-night.jpg','assets/league-meme.jpg'],year:'4 / 大联赛们',title:'场上和场边一起炸开的声音',text:'从发球到围圈，从赛前战术会到赢球后的夜晚，大联赛的每一张照片都留着商排最响的声音。'},farewell:{imgs:['assets/farewell.jpg'],year:'5 / 送大四们',title:'后来，我们也送别人',text:'2024 年，我们送别 20 级。那时已经隐约明白，商排里的人总会一届一届往前走。'},graduate:{imgs:['assets/team-dinner.jpg','assets/winter-volleyball.jpg'],year:'6 / 送自己毕业',title:'终于轮到自己毕业',text:'开伙饭、校外球场和冬天的晚上，原来都成了最后想多看一眼的日常。'},message:{imgs:['assets/yijia-avatar.jpeg'],year:'7 / 给后来的你们',title:'寄语已解锁',text:'愿你们在每一次接不起的球之后，还是会回到场上。愿商排一直有人并肩、有人呐喊、有人把这些时刻好好记住。'}};
const intro=document.querySelector('#intro'),map=document.querySelector('#map'),dialog=document.querySelector('#memoryDialog'),girl=document.querySelector('#mapGirl'),memoryImg=document.querySelector('#memoryImg'),memoryYear=document.querySelector('#memoryYear'),memoryTitle=document.querySelector('#memoryTitle'),memoryText=document.querySelector('#memoryText'),galleryCount=document.querySelector('#galleryCount'),lockedPlace=document.querySelector('[data-memory="message"]');let activeMemory=null,photoIndex=0,autoPlay=null;const seen=new Set();function renderPhoto(){const imgs=data[activeMemory].imgs;memoryImg.style.opacity=0;setTimeout(()=>{memoryImg.src=imgs[photoIndex];memoryImg.style.opacity=1;galleryCount.textContent=`${photoIndex+1} / ${imgs.length}`},120)}function stopAuto(){clearInterval(autoPlay)}function startAuto(){stopAuto();if(data[activeMemory].imgs.length>1)autoPlay=setInterval(()=>{photoIndex=(photoIndex+1)%data[activeMemory].imgs.length;renderPhoto()},4200)}function unlockMessage(){if(seen.size===7){lockedPlace.classList.remove('locked');lockedPlace.removeAttribute('aria-disabled');lockedPlace.querySelector('.dot').textContent='7';lockedPlace.querySelector('small').textContent='已经开启';localStorage.setItem('volleyball-message-unlocked','true')}}function openMemory(key){activeMemory=key;photoIndex=0;const m=data[key];memoryYear.textContent=m.year;memoryTitle.textContent=m.title;memoryText.textContent=m.text;renderPhoto();dialog.showModal();startAuto()}if(localStorage.getItem('volleyball-message-unlocked')){lockedPlace.classList.remove('locked');lockedPlace.removeAttribute('aria-disabled');lockedPlace.querySelector('.dot').textContent='7';lockedPlace.querySelector('small').textContent='已经开启'}document.querySelector('#enter').onclick=()=>{intro.classList.add('hide');map.classList.add('show');scrollTo(0,0)};document.querySelector('#back').onclick=()=>{map.classList.remove('show');intro.classList.remove('hide')};document.querySelectorAll('.place').forEach(el=>el.onclick=()=>{if(el.classList.contains('locked'))return;girl.style.left=el.dataset.x;girl.style.top=el.dataset.y;const key=el.dataset.memory;if(key!=='message'){seen.add(key);unlockMessage()}setTimeout(()=>openMemory(key),420)});document.querySelector('#galleryPrev').onclick=()=>{photoIndex=(photoIndex-1+data[activeMemory].imgs.length)%data[activeMemory].imgs.length;renderPhoto();startAuto()};document.querySelector('#galleryNext').onclick=()=>{photoIndex=(photoIndex+1)%data[activeMemory].imgs.length;renderPhoto();startAuto()};document.querySelector('#close').onclick=()=>{stopAuto();dialog.close()};document.querySelector('#next').onclick=()=>{stopAuto();dialog.close()};dialog.addEventListener('close',stopAuto);
</script></body></html>
