<script>
const data={high:{imgs:['assets/high-school-court.webp'],year:'0 / 高中 · 从这里开始',title:'',text:'刚开始喜欢排球时，我大概没有想过，后来会以商排一员的身份，在大学四年里认识这么多重要的人，经历这么多难忘的比赛。<br><br>高二还是高三，好朋友拉我去打球；大家没有一个人真正会打，却总会趁自由活动跑到球场上乱打一通。不专业，却纯粹又热闹。<br><br>后来看《排球少年》，那些不服输的瞬间、队友之间的信任，以及普通人也能慢慢变强的可能，让“觉得很好玩”变成了真正被排球打动。'},u20:{imgs:['assets/u20-2022.webp','assets/u20-2023-bronze.webp','assets/u20-2023-group.webp','assets/u20-2023-court.webp','assets/u20-2024-group.webp'],captions:['2022 U20 · 练习发球','2023 U20 · 季军合照','2023 U20 · 大合照','2023 U20 · 赛场上','2024 U20 · 全队合照'],year:'1 / U20 · 2023.04 → 2024.04',title:'两次 U20，和两届队友',text:'U20 是只属于大一、大二的比赛。2023 年 4 月，我和 21 级的一娆、钰洁一起参赛；2024 年 4 月，身边又换成了 23 级的雨彤、思文、安淇。第一次试训是在篮球场背面的小球场，后来又去操场对垫。刚进队时，半截红头发的 py 师姐和热热闹闹的球队氛围，构成了我对商排最初的印象。<br><br>从还在学着发球、学着找到自己的位置，到和不同届的队友一起站上场，U20 记录了我在商排最早的两年。后来再看 23 级的妹妹们自己打，再到 24 级、甚至 25 级的妹妹们在场上串联，总会觉得很感慨：大家真的都在一点点长大，也把商排继续往前带。'},morning:{imgs:['assets/morning-training.webp','assets/home-wall-practice.webp'],captions:['早训 · 礼堂后','2022 · 家里垫墙'],year:'2 / 早训 · 06:40 的礼堂后',title:'礼堂后面那面墙',text:'刚开始垫墙，是真的完全不会，节奏甚至还是反的。20 级师姐们在旁边看着，我压力特别大，反而还越急越乱：每次都想多垫几个，但基本五六个就断了。后来因为疫情回家很无聊，每天在家对着墙垫。练着练着，突然有一天发现自己能连续垫一百多个了。<br><br>6:40 到礼堂后真的特别难，每次都是 6:20 起来慢慢吞吞地洗漱一下，换个衣服，然后狂冲过去。还记得有段时间出勤率很差，py 师姐把我们拉到明法一楼开了个会，语气不重但大家都听进去了，从那以后人就慢慢齐起来了。<br><br>还有和一娆的对垫，一娆是一个很看重基本功的人，不止是早训，晚训也常常带着我们去球场旁边的墙上垫。现在回想，最记得的不是练到多少个，而是礼堂后面那面墙、很早的天，还有大家都在认真练球的样子。'},cup:{imgs:['assets/champions-cup.webp','assets/cup-2023-outdoor-1.webp','assets/cup-2023-outdoor-2.webp','assets/cup-2023-group-photo.webp','assets/cup-2023-final-night.webp'],captions:['2022 冠军杯','2023 冠军杯 · 室外合照 1','2023 冠军杯 · 室外合照 2','2023 冠军杯 · 小组赛后合照','2023 冠军杯 · 决赛夜'],year:'3 / 冠军杯 · 每年九月',title:'那些冠军杯的九月',text:'冠军杯总在新学期的九月抵达，也串起了商排四年里许多不同的面孔与夜晚。大一时，我第一次以“商排队员”的身份站在场边，在场下看汶霞师姐和 py 师姐打球。汶霞师姐接一灵活、扣球果断，发飘球时又稳又有力量；每一次看她把球干净利落地处理过去，都会觉得特别崇拜。py 师姐一直是队伍的主心骨，即使后来不再担任队长，也常和小猪师姐、彬彬师姐和悠珍师姐早早来视察我们早训；只要她在，心里就会特别安心。<br><br>男队这边，嘉文师兄、书睿师兄和乔木在场上的串联也让人叹为观止。嘉文师兄每次扣球的姿势都特别舒展好看，起跳、挥臂、收势一气呵成，站在场下远远看着都觉得赏心悦目。<br><br>书睿师兄则是每一年、每一次比赛都用他精巧的技术让我们惊叹——直线、小斜、大斜，每一次他把球钉到对面地板上，场边都会沸腾。<br><br>乔木是和我们最最亲近的一位师兄，我敢说他鼓励过商排 99% 的人（剩下的 1% 大概是来球场不够多吧）。特别是多冉和我当队长的时候，他、一娆和书睿师兄给了我们很多建议和支持。在场上，他也是最能带动整支队伍的人，每一记传球、每一次拦网、每一个二次球，都能让场边的我们忍不住欢呼。'},league:{imgs:['assets/league-2024-champion-night.webp','assets/league-2024-cheer.webp','assets/league-2024-group-photo.webp','assets/league-2024-minshang-tactics.webp','assets/league-2024-meme.webp'],captions:['2024 大联赛 · 冠军之夜','2024 大联赛 · 加油','2024 大联赛 · 小组赛后合照','2024 大联赛 · 打民商前夜战术会议','2024 大联赛 · 而今迈步从头越'],year:'4 / 大联赛 · 那些比赛',title:'大联赛的那些比赛',text:'大联赛不只是一场球，而是很多个赛前、赛中和赛后的晚上。大一对民商的那场，很多位置和比分已经模糊了，但我一直记得汶霞师姐站上发球线的样子：落后时，场上和场边都有一点安静；一颗、两颗、很多颗发球过去，情绪一点点被点燃，比分被追平，最后我们赢了。<br><br>2024 年在面对民商前，我们还专门开过一次简短的战术会。那次会议让我印象特别深：大家认真讨论每一个细节，想一起把这场球打好。也是从那时起，我才很具体地感到商排像一个家，开始对这里、对每一个人有很深的归属感。py 师姐在场上指挥大家时特别有魅力；小猪师姐稳得让人放心；悠珍师姐一在，场上场下都特别热闹。荻之师姐的一传和防守总能让整个队伍稳下来，每次暂停时也是她在冷静地给大家分析局势；彬彬师姐的传球是整支球队顺利运转的关键，不管多难的球到了她手上，捞球、调整、出手，总能稳稳地送到位；一娆是年纪和我们最近的师姐，也是我们最亲密的师姐之一，她对每一件事的认真都让人佩服——每一次传球、每一次对垫、每一次练习结束后，她都会问我们"你觉得我还有哪里可以改进的"，这种较真劲儿也一直在影响着我们。'},farewell:{imgs:['assets/farewell.webp','assets/farewell-2025-1.webp','assets/farewell-2025-2.webp'],year:'6 / 送大四 · 又一年毕业季',title:'后来，我们也送别人',text:'19 级、20 级、21 级的师姐们陆续离开，才慢慢意识到，曾经习以为常的训练、并肩比赛、场边加油和赛后聊天，都会成为回不去的日常。<br><br>我们也不止一次感慨：为什么之前没有和师兄师姐多打一点球，为什么没有更珍惜有人带着早训的日子。后来，我们也站在送别的人群里。队伍一直在更替，这也是商排最真实的成长课。'},graduate:{imgs:['assets/graduate-1.webp','assets/graduate-2.webp','assets/graduate-3.webp','assets/graduate-4.webp','assets/graduate-5.webp','assets/graduate-6.webp','assets/graduate-7.webp'],captions:['球场合照 · 奖杯与花束','奖杯与向日葵','拍立得 · 球场留念','拍立得 · 捧花','拍立得 · 全队合影','毕业季 · 和队友们','试戴学士帽'],year:'7 / 送自己毕业 · 终于轮到我们',title:'原来真的轮到自己了',text:'从被汶霞师姐和 py 师姐带着的替补主攻，到后来以自己的身份留在场上、成为商排的一员，时间已经悄悄往前走了很远。<br><br>毕业会让我们离开校园，也会让一代代队员继续往前走。原来那些以为会一直持续的早训、晚训、比赛和合照，都具体得让人想再多看一眼。终于轮到我们毕业，也终于更明白当年被送别的人是什么心情。'},outside:{imgs:['assets/outside-2023-dinner.webp','assets/outside-yunnan-kitchen.webp','assets/outside-2023-winter-1.webp','assets/outside-2023-winter-2.webp','assets/outside-2025-party.webp'],captions:['2023.09 · 开伙饭','云南小厨','2023 冬天 · 校外打球 1','2023 冬天 · 校外打球 2','2025 · 轰趴'],year:'5 / 球场之外 · 没有比分的时刻',title:'不在场上，也有我们',text:'商排留给我的从来不只是一场场比赛。还有开伙饭、校外球场、冬天一起打球的晚上；还有训练后聊天、赛前紧张、赢球后一起欢呼的日常。它们没有比分，也不需要复盘，却一点点把我们变成了更熟悉的人。<br><br>毕业临近时，最想多看一眼的，往往就是这些在球场之外、却同样重要的时刻。'},message:{imgs:['assets/yijia-avatar.webp'],year:'8 / 彩蛋',title:'寄语',text:'To 多子 4.17：<br>多是我在大学交到的第二个好朋友。感谢我的测测启蒙老师、Kpop 文艺复兴引路人、排球情绪按摩师、啦啦队长、御用眼线化妆师。<br>多是一个性格和别人很不一样的人。第一次见到她，觉得她友善但很高冷，因为在完全不认识的时候她就全勤我们班的比赛，但从来不笑。后来发现她时常走着走着突然开始笑，问就是“想到好笑的事情了”。可她经常笑完又马上绷住——大概是有偶像包袱吧。总之是一个内心戏丰富的、非常淡的浓人。<br>她也离开北京了，不知道我们的下一次见面是 12 月在北京还是未来的某一天在日本，想到这里心里就有点空落落的。<br>我们一起打球吃烤肉打惯蛋打大富翁唱 K，我们老是给彼此分享一些乱七八糟的东西，包括但不限于各种稀奇古怪的 prompt、ao3、小排球和八卦。<br>我听的 90% 的 Kpop 歌曲都是从 Dr 的 KTV 歌单里搜刮来的，最后悔的事情大概是大一没有和她一起买 NewJeans 的卫衣吧！我们一起吃过圣水洞地铁口热腾腾的鱼饼汤、淋过首尔的鹅毛大雪、逛了好多次 Olive Young、在 SM 大楼下面打卡，还在首尔的公交车上一起看晚霞。好想再和你一起旅游，晚上关了灯两个人一起在床上笑的日子太幸福了！<br>离别之际总有很多不舍。希望以后还能一起在某个城市的街道上边吃东西边散步，希望以后还能一起谈天说地，希望以后还能一起打排球，希望以后还能一起唱我站在草原望北京。<br><br>To 立欣 12.20：<br>你好李奶奶老师，今天才得知你居然是因为冠军杯打的热血沸腾所以才加入的商排，我实在是太惊讶了。其实想写给你的小作文已经发了，所以就在这里祝福你研究生生涯学业顺利，继续快乐排球！！<br><br>To 坤桑：<br>毕业快乐～～之前大家打完球一起去马氏拉面吃饭玩游戏聊天的日子实在是太惬意了，以至于它已经变成了我的第六食堂。<br>从大一的副攻到自由人，再到后面的全能补位，你一直在不断挑战自己，我们也能看出你的接一和防守有了多大的进步。当队长的一年里，你也特别认真地为商男、商排出谋划策，认真又负责地组织了一次次训练，商男有你真是太好了！<br>希望你在后面的日子里也能和我们多多打球，有机会约饭～～<br><br>To 明睿：<br>同样的也是毕业快乐～～一边担任排协主席一边担任商男半个队长的你也是辛苦了，没有你，商男会缺少一个能够带动气氛、稳定军心的核心，大家都看在眼里。<br>虽然不知道你的未来规划是怎么样的，但是还是衷心祝愿你能够继续享受排球享受生活～～<br><br>To 潇文：<br>世界上最伟大的经理大人毕业快乐！！每一次比赛的后勤保障、每一条精心编辑的推送，都离不开你默默的付出。可以说没有你，商排的日常运转根本无从谈起。<br>想起来我们一起上财务管理的日子，还有一起看 IVL、一起讨论第五的日子，那些课间和赛后的碎碎念都是特别珍贵的回忆。<br>希望你在新加坡一切顺利，每天都能开开心心的！<br><br>To 金林：<br>最好的小妹妹 1 号，最积极打球的一位。真不敢想象就要和你分开，早训教你垫墙的日子仿佛就发生在昨天。从一位特别积极打球的师妹，到一起打第五的好朋友，再到非常值得信赖的商排队长——每一次身份的转变，都是我们友谊更进一步的象征。<br>希望你后面的两年可以继续带着商排的师弟师妹们一起进步，相信你对排球的热情和认真会打动每一个见到过它的人。希望后面还能一起打打游戏，我还没有上过六阶，我还没有摸出过 140w 的项链。希望你对排球和生活的积极可以常伴你左右。<br>最后，打球记得涂防晒。<br><br>To 机机大王：<br>最好的小妹妹 2 号，和我最熟的一位。虽然你老是说第一次被师兄压力是我安慰你所以对我有好感，但是我其实完全不记得这个情节了。<br>对你的初印象是一个超级外向的师妹，每次都不敢和你多说话因为你说话速度太快了。后面知道你是我的老乡，不知道为什么就开始把你当成我妹沟通。我们一起吃了好多次饭，去了景德镇玩泥巴，打了非常多游戏，聊了很多天，和你在一起的时候一点都不会觉得尴尬（突然发表暴论时除外）。看着你从不敢上场到现在可以大胆扣大胆传，由衷为你感到开心，希望你在学业和球业上都有更好的发展，希望以后还可以多多聊天多多旅游！<br><br>To 雨彤：<br>最好的小妹妹 3 号，打球最猛的一位。对你的初印象是会上手的天才师妹，后面你一次又一次用你的重扣和 ace 刷新我对你的认知。感觉你的性格非常好，特别乐意和你聊天。<br>衷心祝愿你在后面的时间里享受这个球场，继续带着商女走下去！<br><br>To 思文：<br>最好的小妹妹 4 号，进步最大的一位。你的二传水平的进步简直到了让人叹为观止的程度，每一次的捞球、调球、救球，都会让人觉得这个队伍有你真好。<br><br>To 雨璇：<br>你给人最大的感受就是稳，不知道为什么你会在场上那么紧张！希望后面你也可以像上学期一样多来打打野场，期待你下学期的表现～～<br><br>To 思瑗：<br>世界上最伟大的经理 2 号你好。我们的缘分太奇妙了，莫名其妙就在一个队打美赛国赛还很奇妙的拿了不错的奖。那几天的通宵太痛苦以至于我已经完全不愿回忆！<br>虽然你本人只是一个小学生，但是球队有你真的特别幸运（可以再讲一遍你选择加入商排的故事吗 星星眼.jpg）<br>衷心祝愿你在大四和以后的生活学业一帆风顺，在小学生枪战游戏里也把把夺冠～～<br><br>安淇、明家、君健、忠和、程好、君予、余悦、宇恒——和你们在一起的每一次训练、每一场比赛，都是特别开心的回忆，希望你们未来的路越走越远，越走越精彩。还有 25 级的妹妹们，你们的进步真的很快，无论是垫墙、对垫，还是后面练习的发球和扣球，都能看出你们对排球的热爱。期待你们在明年的 U20 带给我们一些惊喜～'}};

ause();bgmBtn.classList.remove('playing');bgmBtn.textContent='♪'}}bgmBtn.onclick=toggleBgm;function launchConfetti(){const colors=['#dc5d3a','#e6b75e','#1c5a59','#fff','#b8e2df','#f5ead9','#ff6b6b','#48dbfb','#feca57','#ff9ff3'];const container=document.createElement('div');container.id='confetti-container';container.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';document.body.appendChild(container);for(let i=0;i<80;i++){const el=document.createElement('div');el.className='confetti';const size=Math.random()*8+6;const shapes=['50%','0','2px'];el.style.width=size+'px';el.style.height=size*(Math.random()*0.6+0.6)+'px';el.style.borderRadius=shapes[Math.floor(Math.random()*3)];el.style.background=colors[Math.floor(Math.random()*colors.length)];el.style.left=Math.random()*100+'vw';el.style.animationDuration=(Math.random()*2+2)+'s';el.style.animationDelay=(Math.random()*1.5)+'s';container.appendChild(el)}setTimeout(()=>container.remove(),5000)}
