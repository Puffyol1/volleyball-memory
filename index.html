<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#061523" />
  <title>我的四年排球故事</title>
  <style>
    :root { --ink:#e9eef1; --night:#061523; --green:#123f37; --red:#dc5d3a; --cream:#f4eee3; --gold:#e6b75e; }
    * { box-sizing:border-box; } html { background:var(--night); } body { margin:0; background:var(--night); color:var(--ink); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; overflow-x:hidden; }
    button { font:inherit; } .screen { min-height:100svh; position:relative; isolation:isolate; overflow:hidden; }
    .stars::before,.stars::after { content:""; position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(circle at 8% 15%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 75% 12%,#b8e2df 0 1px,transparent 1.5px),radial-gradient(circle at 88% 44%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 21% 67%,#cbe7d7 0 1px,transparent 1.5px),radial-gradient(circle at 57% 78%,#fff 0 1px,transparent 1.5px); opacity:.7; background-size:210px 210px,260px 260px,310px 310px,360px 360px,420px 420px; animation:drift 16s linear infinite; }
    .stars::after { opacity:.25; filter:blur(1px); transform:scale(1.2); animation-direction:reverse; }
    @keyframes drift { to { background-position: 210px 300px, -260px 240px, 310px -180px, -360px -240px, 420px 190px; } }
    #intro { display:flex; flex-direction:column; justify-content:flex-end; padding:clamp(28px,7vw,76px); background:radial-gradient(circle at 76% 22%,#1b5452 0,rgba(27,84,82,.2) 18%,transparent 40%),linear-gradient(155deg,#071324 0%,#082333 55%,#092c24 100%); }
    .intro-copy { position:relative; z-index:2; max-width:640px; padding-bottom:max(16px,env(safe-area-inset-bottom)); }
    .label { font-size:10px; letter-spacing:.22em; color:#9fadb4; margin-bottom:16px; } h1 { font-size:clamp(32px,6.2vw,76px); line-height:1.02; margin:0; letter-spacing:-.07em; font-weight:800; } h1 span { color:var(--red); } .quote { margin:20px 0 22px; max-width:420px; font-size:11px; line-height:1.8; color:#9baba8; letter-spacing:.03em; }
    .start { display:inline-flex; align-items:center; gap:10px; border:1px solid rgba(255,255,255,.13); border-radius:12px; padding:13px 17px; color:#fff; background:rgba(255,255,255,.08); box-shadow:0 10px 30px rgba(0,0,0,.18); cursor:pointer; transition:.25s; } .start:hover { transform:translateY(-2px); background:rgba(255,255,255,.14); } .ball-icon,.ball { width:20px; aspect-ratio:1; border-radius:50%; background:conic-gradient(#fff 0 17%,#df5739 17% 34%,#fff 34% 50%,#2d8f76 50% 67%,#fff 67% 83%,#df5739 83%); border:1px solid rgba(0,0,0,.25); box-shadow:inset 0 0 0 1px rgba(255,255,255,.36); }
    .girl { position:absolute; z-index:1; right:clamp(24px,16vw,260px); top:clamp(46px,11vh,120px); width:clamp(112px,17vw,225px); filter:drop-shadow(0 24px 22px rgba(0,0,0,.28)); animation:float 4s ease-in-out infinite; } @keyframes float{50%{transform:translateY(-10px)}}
    .girl .head{width:32%; aspect-ratio:1; margin:0 auto -3%; background:#bd825e; border-radius:50%; position:relative; z-index:3}.girl .pony{position:absolute;width:20%;height:25%;background:#17221e;border-radius:50% 50% 40% 50%;left:64%;top:-3%;transform:rotate(25deg)}.girl .body{width:42%;height:38%;margin:auto;background:#131b1d;border-radius:30% 30% 12% 12%;position:relative}.girl .body:after{content:"";position:absolute;inset:15% 37%;border-radius:50%;background:#d6b94c}.girl .arms{position:absolute;width:70%;height:12%;background:#bd825e;top:40%;left:17%;transform:rotate(-20deg);border-radius:20px}.girl .shorts{width:40%;height:15%;background:#15191c;margin:-2% auto 0}.girl .legs{display:flex;gap:12%;width:37%;margin:auto}.girl .legs i{display:block;width:42%;height:24%;background:#bd825e;border-radius:0 0 40% 40%}.girl .ball{position:absolute;right:-13%;top:46%;width:25%;animation:spin 3s linear infinite}@keyframes spin{to{rotate:360deg}}
    #map { display:none; min-height:100svh; padding:24px 16px 40px; background:linear-gradient(180deg,#07192a,#08251f 65%,#0d3429); } #map.show { display:block; } #intro.hide { display:none; } .map-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; position:relative; z-index:2; }.map-head h2{margin:4px 0;font-size:24px;letter-spacing:-.05em}.map-head p{margin:0;color:#9fb2ac;font-size:12px}.back{border:0;background:transparent;color:#c7d6d3;padding:10px;cursor:pointer}
    .route { position:relative; margin:26px auto 0; max-width:1100px; min-height:760px; background:radial-gradient(ellipse at 15% 72%,rgba(185,221,188,.13),transparent 25%),radial-gradient(ellipse at 75% 20%,rgba(255,222,161,.13),transparent 29%); border:1px solid rgba(255,255,255,.09); border-radius:28px; overflow:hidden; } .route:before { content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 22%,rgba(244,238,227,.1) 22.3%,transparent 22.7%,transparent 50%,rgba(244,238,227,.1) 50.3%,transparent 50.7%);opacity:.8 }
    .route-title { position:absolute; top:30px; left:30px; font-size:12px; color:#b5c4be; letter-spacing:.13em; }.path { position:absolute; left:13%; top:15%; width:72%; height:68%; border:2px dashed rgba(235,235,197,.33); border-radius:47% 44% 40% 55%; rotate:-10deg; }
    .place { position:absolute; z-index:2; width:min(160px,36vw); background:transparent;border:0;color:#fff;text-align:left;cursor:pointer; padding:0;}.place .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(235,243,229,.15);border:1px solid rgba(255,255,255,.35);box-shadow:0 0 0 10px rgba(196,228,191,.06),0 0 28px rgba(218,233,202,.32);margin-bottom:8px; animation:pulse 2.3s infinite}.place b{font-size:15px;display:block}.place small{color:#b4c5bd;font-size:11px;line-height:1.5}@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(196,228,191,0),0 0 36px rgba(218,233,202,.48)}}
    .p1{left:10%;top:58%}.p2{left:32%;top:39%}.p3{right:26%;top:16%}.p4{right:8%;bottom:13%}.place .ball-icon{width:18px}.little-girl{position:absolute;left:51%;top:52%;z-index:2;font-size:32px;filter:drop-shadow(0 6px 5px #0008);animation:walk 2.4s ease-in-out infinite}@keyframes walk{50%{translate:7px -6px}}
    dialog { border:0;background:transparent;padding:0;max-width:min(920px,94vw);width:100%;color:#fff; } dialog::backdrop{background:rgba(0,8,14,.82);backdrop-filter:blur(8px)}.memory { position:relative;overflow:hidden;border-radius:24px;background:#0c1e25;box-shadow:0 30px 80px #000c;display:grid;grid-template-columns:1.05fr .95fr;min-height:440px}.memory img{width:100%;height:100%;min-height:440px;object-fit:cover;filter:saturate(.86) contrast(1.05)}.memory .text{padding:42px 38px;align-self:center}.memory .year{color:var(--gold);font-size:11px;letter-spacing:.16em}.memory h3{font-size:32px;margin:12px 0 18px;letter-spacing:-.06em}.memory p{line-height:1.9;color:#d2dcd7;font-size:15px}.close{position:absolute;right:14px;top:14px;width:36px;height:36px;border:1px solid #ffffff33;border-radius:50%;background:#06121acc;color:#fff;font-size:20px;cursor:pointer;z-index:3}.next{border:0;background:var(--red);color:#fff;border-radius:9px;padding:10px 14px;margin-top:13px;cursor:pointer}
    @media(max-width:620px){#intro{padding:28px 18px 28px}.girl{right:30px;top:44px;width:112px}.intro-copy{padding-bottom:0}.quote{font-size:9px;margin:16px 0 18px;max-width:270px}.start{padding:12px 14px;font-size:13px}.route{min-height:650px;border-radius:20px}.route-title{top:22px;left:20px}.place{width:120px}.place b{font-size:13px}.place small{font-size:10px}.p1{left:8%;top:61%}.p2{left:30%;top:40%}.p3{right:12%;top:17%}.p4{right:5%;bottom:11%}.little-girl{left:49%;top:53%;font-size:26px}.memory{grid-template-columns:1fr;max-height:90svh;overflow:auto}.memory img{min-height:230px;height:230px}.memory .text{padding:26px 24px}.memory h3{font-size:27px}.memory p{font-size:14px}.path{left:11%;width:76%}}
  </style>
</head>
<body>
  <main>
    <section id="intro" class="screen stars">
      <div class="girl" aria-hidden="true"><div class="pony"></div><div class="head"></div><div class="arms"></div><div class="body"></div><div class="shorts"></div><div class="legs"><i></i><i></i></div><div class="ball"></div></div>
      <div class="intro-copy"><div class="label">YIJIA / VOL. 01</div><h1>昨天的失败者们，<br>今天的我们<br><span>又是什么人呢？</span></h1><p class="quote">今日は敗者であっても、それが君を決定づけるものではない。<br>明日の君はもう敗者じゃない。では、なにをする？何者になる？</p><button class="start" id="enter"><i class="ball-icon"></i>点击探索排球故事</button></div>
    </section>
    <section id="map" class="stars"><header class="map-head"><div><div class="label">MY VOLLEYBALL ATLAS</div><h2>跟着球，回到那些时刻</h2><p>点击地图里的光点，打开一段回忆。</p></div><button class="back" id="back">← 首页</button></header>
      <div class="route"><div class="route-title">06:40 → 21:00 / 一天与四年的球场</div><div class="path"></div><div class="little-girl">🏐</div>
        <button class="place p1" data-memory="high"><span class="dot">01</span><b>第一次把球垫起来</b><small>高中 / 一切从乱打开始</small></button>
        <button class="place p2" data-memory="morning"><span class="dot">02</span><b>06:40 礼堂后</b><small>早训、红墙与 100+</small></button>
        <button class="place p3" data-memory="cup"><span class="dot">03</span><b>九月的冠军杯</b><small>第一次正式站上场边</small></button>
        <button class="place p4" data-memory="league"><span class="dot">04</span><b>四月的大联赛</b><small>夜色、围圈与一起赢下来的声音</small></button>
      </div>
    </section>
  </main>
  <dialog id="memoryDialog"><article class="memory"><button class="close" id="close">×</button><img id="memoryImg" src="" alt="回忆照片"><div class="text"><div class="year" id="memoryYear"></div><h3 id="memoryTitle"></h3><p id="memoryText"></p><button class="next" id="next">继续往前走 →</button></div></article></dialog>
  <script>
    const data={high:{img:'assets/high-school-court.jpg',year:'HIGH SCHOOL / 起点',title:'几个人都不会打，却总往球场跑',text:'我第一次打排球，大概是在高二还是高三。好朋友拉着我去，几个人里没有一个人真的会打。但每次自由活动，我们还是会跑到排球场，乱打一通。后来才知道，那颗乱飞的球，会把我带到很远的地方。'},morning:{img:'assets/morning-training.jpg',year:'06:40 / 礼堂后',title:'从节奏反着，到 100+',text:'一开始早训垫墙，我完全不会，甚至节奏都是反着的。看着师姐们一下一下垫得很稳、很久，只觉得羡慕。疫情回家时我带了一颗球，每天对着家里的墙垫，垫着垫着，发现自己也能连续一百多个了。'},cup:{img:'assets/champions-cup.jpg',year:'SEPTEMBER / 冠军杯',title:'第一次作为商排队员站在场边',text:'进商排后的第一场正式比赛，是冠军杯。汶霞师姐和 py 师姐都是主攻，我作为替补站在她们身后。那时我还不知道，之后四年会留下多少人的名字、多少场球和多少个不愿散场的晚上。'},league:{img:'assets/league-cheer.jpg',year:'APRIL / 大联赛',title:'场上和场边一起炸开的声音',text:'我最先想起的，是大一大联赛对民商的那场。汶霞师姐站上发球线，一颗又一颗地发过去；记得比分一点点被追上，记得最后赢下来时，场上和场边一起炸开的声音。'}};
    const intro=document.querySelector('#intro'),map=document.querySelector('#map'),dialog=document.querySelector('#memoryDialog');document.querySelector('#enter').onclick=()=>{intro.classList.add('hide');map.classList.add('show');window.scrollTo(0,0)};document.querySelector('#back').onclick=()=>{map.classList.remove('show');intro.classList.remove('hide')};document.querySelectorAll('.place').forEach(el=>el.onclick=()=>{const m=data[el.dataset.memory];memoryImg.src=m.img;memoryYear.textContent=m.year;memoryTitle.textContent=m.title;memoryText.textContent=m.text;dialog.showModal()});document.querySelector('#close').onclick=()=>dialog.close();document.querySelector('#next').onclick=()=>dialog.close();
  </script>
</body>
</html>
