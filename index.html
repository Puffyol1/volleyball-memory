<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061523"><title>我的四年排球故事</title>
<style>
:root{--ink:#e9eef1;--night:#061523;--green:#123f37;--red:#dc5d3a;--gold:#e6b75e}*{box-sizing:border-box}html,body{margin:0;background:var(--night);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}button{font:inherit}.screen{min-height:100svh;position:relative;overflow:hidden}.night{background:radial-gradient(circle at 76% 22%,#1b5452 0,rgba(27,84,82,.16) 18%,transparent 42%),linear-gradient(155deg,#071324,#082333 55%,#092c24)}.stars{background-image:radial-gradient(circle at 8% 15%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 75% 12%,#b8e2df 0 1px,transparent 1.5px),radial-gradient(circle at 88% 44%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 21% 67%,#cbe7d7 0 1px,transparent 1.5px);background-size:210px 210px,260px 260px,310px 310px,360px 360px}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.7;animation:twinkle 2.8s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.15;transform:scale(.5)}}
#intro{display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(28px,7vw,76px)}.intro-copy{z-index:2;max-width:640px;padding-bottom:max(16px,env(safe-area-inset-bottom))}.label{font-size:10px;letter-spacing:.22em;color:#9fadb4;margin-bottom:16px}h1{font-size:clamp(32px,6.2vw,76px);line-height:1.02;margin:0;letter-spacing:-.07em;font-weight:800}h1 span{color:var(--red)}.quote{margin:20px 0 22px;max-width:420px;font-size:11px;line-height:1.8;color:#9baba8;letter-spacing:.03em}.start{display:inline-flex;align-items:center;gap:10px;border:1px solid #ffffff24;border-radius:999px;padding:13px 18px;color:#fff;background:#ffffff12;box-shadow:0 10px 30px #0003;cursor:pointer;transition:.2s}.start:hover{transform:translateY(-2px);background:#ffffff20}.start-mark{width:17px;height:17px;border:1.4px solid #d8e4de;border-radius:50%;position:relative;display:inline-block}.start-mark:before,.start-mark:after{content:"";position:absolute;background:#d8e4de;left:3px;right:3px;height:1px;top:7px;transform:rotate(28deg)}.start-mark:after{transform:rotate(-36deg)}.girl{position:absolute;z-index:1;right:clamp(24px,16vw,250px);top:clamp(34px,6vh,80px);width:clamp(145px,22vw,290px);height:auto;filter:drop-shadow(0 24px 24px #0007);animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}@keyframes spin{to{rotate:360deg}}.map-girl img{width:100%;height:100%;object-fit:contain;object-position:center bottom}
#map{display:none;min-height:100svh;padding:24px 16px 40px;background:linear-gradient(180deg,#07192a,#08251f 65%,#0d3429)}#map.show{display:block}#intro.hide{display:none}.map-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;position:relative;z-index:2}.map-head h2{margin:4px 0;font-size:24px;letter-spacing:-.05em}.map-head p{margin:0;color:#9fb2ac;font-size:12px}.back{border:0;background:transparent;color:#c7d6d3;padding:10px;cursor:pointer}.route{position:relative;margin:26px auto 0;max-width:1100px;min-height:820px;background:radial-gradient(ellipse at 15% 72%,#b9ddbc22,transparent 25%),radial-gradient(ellipse at 75% 20%,#ffdea122,transparent 29%);border:1px solid #ffffff17;border-radius:28px;overflow:hidden}.route:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 22%,#f4eee312 22.3%,transparent 22.7%,transparent 50%,#f4eee312 50.3%,transparent 50.7%)}.route-title{position:absolute;top:30px;left:30px;font-size:12px;color:#b5c4be;letter-spacing:.13em}.path{position:absolute;left:10%;top:12%;width:78%;height:73%;border:2px dashed #ebebc255;border-radius:47% 44% 40% 55%;rotate:-10deg}.place{position:absolute;z-index:3;width:min(175px,38vw);background:transparent;border:0;color:#fff;text-align:left;cursor:pointer;padding:0}.place .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ebf3e522;border:1px solid #ffffff66;box-shadow:0 0 22px #dae9ca4d;margin-bottom:8px}.place b{font-size:15px;display:block}.place small{color:#b4c5bd;font-size:11px;line-height:1.5}@keyframes hop{50%{translate:5px -8px}}.map-girl{position:absolute;z-index:4;width:78px;height:118px;left:50%;top:52%;transition:left .7s cubic-bezier(.2,.8,.2,1),top .7s cubic-bezier(.2,.8,.2,1);animation:hop 2.2s ease-in-out infinite;filter:drop-shadow(0 9px 6px #0008)}.map-girl .head{width:30px;height:30px;background:#bd825e;border-radius:50%;position:absolute;left:24px;top:4px;z-index:2}.map-girl .pony{position:absolute;width:18px;height:31px;background:#17221e;border-radius:55% 45% 60% 40%;left:46px;top:0;rotate:25deg}.map-girl .shirt{position:absolute;width:38px;height:43px;left:20px;top:31px;background:#10191b;border-radius:15px 15px 7px 7px}.map-girl .shirt:after{content:"";position:absolute;width:14px;height:14px;left:12px;top:10px;border-radius:50%;background:#d6b94c}.map-girl .arm{position:absolute;width:32px;height:10px;left:48px;top:41px;border-radius:10px;background:#bd825e;rotate:-23deg}.map-girl .shorts{position:absolute;width:36px;height:16px;left:21px;top:71px;background:#15191c}.map-girl .leg{position:absolute;width:10px;height:25px;top:86px;background:#bd825e;border-radius:0 0 8px 8px}.map-girl .l1{left:26px}.map-girl .l2{left:45px}.map-girl .mini-ball{position:absolute;width:18px;aspect-ratio:1;border-radius:50%;right:0;top:38px;background:conic-gradient(#fff 0 17%,#df5739 17% 34%,#fff 34% 50%,#2d8f76 50% 67%,#fff 67% 83%,#df5739 83%);animation:spin 2s linear infinite}.p1{left:8%;top:62%}.p2{left:28%;top:43%}.p3{left:59%;top:13%}.p4{right:7%;top:38%}.p5{right:12%;bottom:11%}.p6{left:43%;bottom:9%}.p7{left:7%;top:23%}.p8{right:5%;top:67%}
dialog{border:0;background:transparent;padding:0;max-width:min(920px,94vw);width:100%;color:#fff}dialog::backdrop{background:#00080ed1;backdrop-filter:blur(8px)}.memory{position:relative;overflow:hidden;border-radius:24px;background:#0c1e25;box-shadow:0 30px 80px #000c;display:grid;grid-template-columns:1.05fr .95fr;min-height:440px}.memory img{width:100%;height:100%;min-height:440px;object-fit:cover;filter:saturate(.86) contrast(1.05)}.memory .text{padding:42px 38px;align-self:center}.year{color:var(--gold);font-size:11px;letter-spacing:.16em}.memory h3{font-size:32px;margin:12px 0 18px;letter-spacing:-.06em}.memory p{line-height:1.9;color:#d2dcd7;font-size:15px}.close{position:absolute;right:14px;top:14px;width:36px;height:36px;border:1px solid #ffffff33;border-radius:50%;background:#06121acc;color:#fff;font-size:20px;cursor:pointer;z-index:3}.next{border:0;background:var(--red);color:#fff;border-radius:9px;padding:10px 14px;margin-top:13px;cursor:pointer}
@media(max-width:620px){#intro{padding:28px 18px}.girl{right:30px;top:44px;width:112px}.quote{font-size:9px;margin:16px 0 18px;max-width:270px}.start{padding:12px 14px;font-size:13px}.route{min-height:850px;border-radius:20px}.route-title{top:22px;left:20px}.place{width:108px}.place b{font-size:12px}.place small{font-size:9px}.p1{left:7%;top:67%}.p2{left:25%;top:46%}.p3{left:54%;top:16%}.p4{right:4%;top:42%}.p5{right:4%;bottom:12%}.p6{left:35%;bottom:7%}.p7{left:5%;top:25%}.p8{right:4%;top:70%}.map-girl{scale:.78}.memory{grid-template-columns:1fr;max-height:90svh;overflow:auto}.memory img{min-height:230px;height:230px}.memory .text{padding:26px 24px}.memory h3{font-size:27px}.memory p{font-size:14px}}
</style></head>
<body><main>
<section id="intro" class="screen night stars"><i class="spark" style="left:14%;top:28%"></i><i class="spark" style="left:75%;top:58%"></i><img class="girl" src="assets/yijia-player.png" alt="高马尾排球女孩插画"><div class="intro-copy"><div class="label">YIJIA / VOL. 01</div><h1>昨天的失败者们，<br>今天的我们<br><span>又是什么人呢？</span></h1><p class="quote">今日は敗者であっても、それが君を決定づけるものではない。<br>明日の君はもう敗者じゃない。では、なにをする？何者になる？</p><button class="start" id="enter"><i class="start-mark"></i>点击探索排球故事</button></div></section>
<section id="map" class="stars"><header class="map-head"><div><div class="label">MY VOLLEYBALL ATLAS</div><h2>跟着球，回到那些时刻</h2><p>点亮八个光点，把四年慢慢走完。</p></div><button class="back" id="back">← 首页</button></header><div class="route"><div class="route-title">06:40 → 21:00 / 一天与四年的球场</div><div class="path"></div><div class="map-girl" id="mapGirl"><img src="assets/yijia-player.png" alt="高马尾排球女孩"></div>
<button class="place p1" data-memory="high" data-x="12%" data-y="61%"><span class="dot">01</span><b>第一次把球垫起来</b><small>高中 / 一切从乱打开始</small></button><button class="place p2" data-memory="morning" data-x="31%" data-y="44%"><span class="dot">02</span><b>06:40 礼堂后</b><small>早训、红墙与 100+</small></button><button class="place p3" data-memory="u20" data-x="57%" data-y="18%"><span class="dot">03</span><b>三月的 U20</b><small>新生赛 / 还在学着发球</small></button><button class="place p4" data-memory="cup22" data-x="72%" data-y="40%"><span class="dot">04</span><b>2022 冠军杯</b><small>第一次正式上场</small></button><button class="place p5" data-memory="cup23" data-x="80%" data-y="70%"><span class="dot">05</span><b>九月的冠军杯</b><small>小组赛后，夜色还亮着</small></button><button class="place p6" data-memory="league" data-x="48%" data-y="76%"><span class="dot">06</span><b>四月的大联赛</b><small>发球、围圈与冠军之夜</small></button><button class="place p7" data-memory="winter" data-x="12%" data-y="26%"><span class="dot">07</span><b>球场以外</b><small>冬天、校外打球与开伙饭</small></button><button class="place p8" data-memory="farewell" data-x="79%" data-y="68%"><span class="dot">08</span><b>后来我们送别人</b><small>也终于轮到自己毕业</small></button></div></section></main>
<dialog id="memoryDialog"><article class="memory"><button class="close" id="close">×</button><img id="memoryImg" src="" alt="回忆照片"><div class="text"><div class="year" id="memoryYear"></div><h3 id="memoryTitle"></h3><p id="memoryText"></p><button class="next" id="next">继续往前走 →</button></div></article></dialog>
<script>
const data={high:{img:'assets/high-school-court.jpg',year:'HIGH SCHOOL / 起点',title:'几个人都不会打，却总往球场跑',text:'我第一次打排球，大概是在高二还是高三。好朋友拉着我去，几个人里没有一个人真的会打。但每次自由活动，我们还是会跑到排球场，乱打一通。后来才知道，那颗乱飞的球，会把我带到很远的地方。'},morning:{img:'assets/morning-training.jpg',year:'06:40 / 礼堂后',title:'从节奏反着，到 100+',text:'一开始早训垫墙，我完全不会，甚至节奏都是反着的。看着师姐们一下一下垫得很稳、很久，只觉得羡慕。疫情回家时我带了一颗球，每天对着家里的墙垫，垫着垫着，发现自己也能连续一百多个了。'},u20:{img:'assets/u20-2022.jpg',year:'MARCH / U20 新生赛',title:'还在学着把球发过去',text:'U20 是只属于大一、大二的比赛。那时还会为了一个发球反复练习，也还在队伍里慢慢找到自己的位置。后来回看，原来所有看似笨拙的起步，都有它自己的意义。'},cup22:{img:'assets/champions-cup.jpg',year:'SEPTEMBER 2022 / 冠军杯',title:'第一次作为商排队员站在场边',text:'进商排后的第一场正式比赛，是冠军杯。汶霞师姐和 py 师姐都是主攻，我作为替补站在她们身后。那时我还不知道，之后四年会留下多少人的名字、多少场球和多少个不愿散场的晚上。'},cup23:{img:'assets/cup-group-2023.jpg',year:'SEPTEMBER 2023 / 冠军杯',title:'球场的夜，和不愿散的人',text:'九月底的冠军杯，是每个新学期都会抵达的节点。小组赛后合照、决赛夜、球网和应援牌，后来都成了被一遍遍翻出来的照片。'},league:{img:'assets/league-cheer.jpg',year:'APRIL / 大联赛',title:'场上和场边一起炸开的声音',text:'我最先想起的，是大一大联赛对民商的那场。汶霞师姐站上发球线，一颗又一颗地发过去；记得比分一点点被追上，记得最后赢下来时，场上和场边一起炸开的声音。2024 年打民商前夜，大家还开着战术会，认真地把每一颗球再想一遍。'},winter:{img:'assets/team-dinner.jpg',year:'球场以外 / 也是商排',title:'开伙饭、校外球场和冬天',text:'商排不只存在于训练和比赛。也有开伙饭、云南小厨、冬天跑去校外打球的晚上。那些没有比分的时刻，后来想起来也一样闪闪发光。'},farewell:{img:'assets/farewell.jpg',year:'2024 / 送别 20 级',title:'后来，我们也送别人',text:'2024 年，我们送别 20 级。那时已经隐约明白，商排里的人总会一届一届往前走。如今轮到自己毕业，才发现那些曾经以为会一直持续的早训、晚训、比赛和合照，原来都很具体，也很短暂。'}};
const intro=document.querySelector('#intro'),map=document.querySelector('#map'),dialog=document.querySelector('#memoryDialog'),girl=document.querySelector('#mapGirl');document.querySelector('#enter').onclick=()=>{intro.classList.add('hide');map.classList.add('show');scrollTo(0,0)};document.querySelector('#back').onclick=()=>{map.classList.remove('show');intro.classList.remove('hide')};document.querySelectorAll('.place').forEach(el=>el.onclick=()=>{girl.style.left=el.dataset.x;girl.style.top=el.dataset.y;const m=data[el.dataset.memory];setTimeout(()=>{memoryImg.src=m.img;memoryYear.textContent=m.year;memoryTitle.textContent=m.title;memoryText.textContent=m.text;dialog.showModal()},420)});document.querySelector('#close').onclick=()=>dialog.close();document.querySelector('#next').onclick=()=>dialog.close();
</script></body></html>
